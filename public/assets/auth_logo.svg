<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldChromeOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="shieldChromeInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <radialGradient id="shieldBgGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0080FF"/>
      <stop offset="35%" stop-color="#0055D4"/>
      <stop offset="75%" stop-color="#002D80"/>
      <stop offset="100%" stop-color="#001440"/>
    </radialGradient>

    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="85%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="swooshGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#0038A8"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="textChromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA200"/>
      <stop offset="40%" stop-color="#FF5D00"/>
      <stop offset="100%" stop-color="#D83000"/>
    </linearGradient>

    <linearGradient id="wingGradLeft" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>

    <linearGradient id="wingGradRight" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#0099FF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>

    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000A1A" flood-opacity="0.6"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000A1A" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- SHIELD EMBLEM -->
  <g filter="url(#badgeShadow)">
    <!-- Shield Outer Dark Border -->
    <path d="M 512,30 L 840,170 C 855,360 840,560 512,710 C 184,560 169,360 184,170 Z" 
          fill="#051224" stroke="#000B18" stroke-width="8" stroke-linejoin="round"/>

    <!-- Shield Chrome Outer Bevel -->
    <path d="M 512,46 L 824,180 C 838,356 824,544 512,690 C 200,544 186,356 200,180 Z" 
          fill="url(#shieldChromeOuter)"/>

    <!-- Shield Chrome Inner Groove -->
    <path d="M 512,68 L 798,198 C 810,350 798,520 512,654 C 226,520 214,350 226,198 Z" 
          fill="#0A1E3C"/>

    <path d="M 512,78 L 788,206 C 800,346 788,510 512,642 C 236,510 224,346 236,206 Z" 
          fill="url(#shieldChromeInner)"/>

    <!-- Shield Inner Royal Blue Background -->
    <path d="M 512,98 L 766,220 C 776,340 766,492 512,618 C 258,492 248,340 258,220 Z" 
          fill="url(#shieldBgGrad)"/>

    <!-- Shield Inner Gloss / Highlights -->
    <path d="M 512,108 L 752,228 C 740,320 680,450 512,500 C 344,450 284,320 272,228 Z" 
          fill="url(#shieldBgGrad)" opacity="0.4"/>
    <path d="M 512,104 L 756,224 C 600,260 400,350 300,520 C 262,410 260,300 268,226 Z" 
          fill="#00D2FF" opacity="0.25"/>

    <!-- COG GEAR (Upper Right behind Car) -->
    <g transform="translate(580, 290)">
      <!-- Gear Outline -->
      <path d="M -50,-140 L 50,-140 L 40,-95 C 65,-85 88,-70 108,-50 L 148,-75 L 195,-20 L 158,15 C 165,40 165,65 158,90 L 195,125 L 148,180 L 108,155 C 88,175 65,190 40,200 L 50,245 L -50,245 L -40,200 C -65,190 -88,175 -108,155 L -148,180 L -195,125 L -158,90 C -165,65 -165,40 -158,15 L -195,-20 L -148,-75 L -108,-50 C -88,-70 -65,-85 -40,-95 Z"
            fill="#030C1A" stroke="#000A16" stroke-width="12" stroke-linejoin="round"/>
      <!-- Gear Fill -->
      <path d="M -44,-134 L 44,-134 L 35,-92 C 58,-82 78,-68 96,-50 L 136,-72 L 182,-20 L 148,12 C 154,34 154,58 148,80 L 182,112 L 136,164 L 96,142 C 78,160 58,174 35,184 L 44,226 L -44,226 L -35,184 C -58,174 -78,160 -96,142 L -136,164 L -182,112 L -148,80 C -154,58 -154,34 -148,12 L -182,-20 L -136,-72 L -96,-50 C -78,-68 -58,-82 -35,-92 Z"
            fill="url(#gearGrad)"/>
      <!-- Inner Ring -->
      <circle cx="0" cy="46" r="68" fill="#00358A" stroke="#041226" stroke-width="10"/>
      <circle cx="0" cy="46" r="60" fill="url(#shieldBgGrad)"/>
      <circle cx="0" cy="46" r="32" fill="#030C1A"/>
      <circle cx="0" cy="46" r="26" fill="url(#gearGrad)"/>
    </g>

    <!-- HIGHWAY / SPEED ROAD SWEEP -->
    <!-- Dark Outline of Swoosh -->
    <path d="M 190,390 C 240,330 380,310 540,360 C 660,400 740,480 730,530 C 720,570 650,560 560,540 C 420,510 280,480 200,430 Z"
          fill="#000F26"/>
    <!-- Silver Road Bed -->
    <path d="M 198,396 C 248,340 375,320 530,368 C 650,408 720,480 710,522 C 670,540 550,525 460,500 C 340,466 240,440 198,396 Z"
          fill="url(#roadGrad)"/>
    <!-- Cyan Speed Ribbon -->
    <path d="M 230,440 C 330,470 480,530 650,556 C 540,580 380,550 270,490 C 245,475 235,455 230,440 Z"
          fill="url(#swooshGrad)"/>
    <path d="M 260,458 C 360,490 490,542 630,560 C 530,574 390,548 290,500 Z"
          fill="#00E5FF" opacity="0.8"/>

    <!-- MODERN WHITE SPORTS CAR -->
    <!-- Car Dark Silhouette Base -->
    <path d="M 230,375 C 245,340 290,310 365,296 C 450,280 540,305 630,345 C 685,370 735,400 730,435 C 725,465 670,470 600,455 C 500,435 340,410 260,410 C 235,410 220,395 230,375 Z"
          fill="#030C1A"/>

    <!-- Car Body Profile (Bright White & Silver Shading) -->
    <path d="M 240,370 C 255,342 300,315 370,302 C 455,286 535,310 620,348 C 672,372 715,400 710,428 C 705,445 660,452 590,440 C 510,424 350,400 270,398 C 248,398 236,386 240,370 Z"
          fill="#FFFFFF"/>

    <!-- Car Windshield & Side Windows (Deep Cyan-Blue Gloss) -->
    <path d="M 360,314 C 420,305 480,320 540,346 C 570,360 595,376 580,385 C 530,380 430,360 365,345 C 330,338 335,320 360,314 Z"
          fill="#002D72" stroke="#00D2FF" stroke-width="3"/>
    <path d="M 370,318 C 425,310 475,324 530,348 C 490,352 430,342 375,334 Z"
          fill="#00A6FF"/>

    <!-- Front Windshield & Pillar -->
    <path d="M 545,348 C 585,366 615,385 628,400 C 600,402 560,392 538,382 C 532,364 538,354 545,348 Z"
          fill="#002255" stroke="#00D2FF" stroke-width="2"/>

    <!-- Car Side Character Line & Reflections -->
    <path d="M 252,382 C 340,382 480,405 580,422 C 650,434 685,426 695,416 C 660,424 590,412 510,396 C 430,380 320,366 252,382 Z"
          fill="#CBD5E1"/>

    <!-- Front Headlight (Aggressive Blue/Cyan LED) -->
    <path d="M 680,412 C 700,416 712,422 708,428 C 695,430 675,424 668,418 Z"
          fill="#00F0FF" filter="drop-shadow(0px 0px 4px #00F0FF)"/>

    <!-- Front Wheel Arch & Rim -->
    <g transform="translate(485, 436)">
      <ellipse cx="0" cy="0" rx="55" ry="46" fill="#030C1A"/>
      <ellipse cx="0" cy="0" rx="46" ry="38" fill="url(#shieldChromeOuter)"/>
      <ellipse cx="0" cy="0" rx="34" ry="28" fill="#06162E"/>
      <circle cx="0" cy="0" r="14" fill="#FFFFFF"/>
    </g>

    <!-- Rear Wheel Arch & Rim -->
    <g transform="translate(290, 400)">
      <ellipse cx="0" cy="0" rx="42" ry="34" fill="#030C1A"/>
      <ellipse cx="0" cy="0" rx="34" ry="26" fill="url(#shieldChromeOuter)"/>
      <ellipse cx="0" cy="0" rx="24" ry="18" fill="#06162E"/>
      <circle cx="0" cy="0" r="10" fill="#FFFFFF"/>
    </g>

    <!-- Speed Arc / Halo over Roof -->
    <path d="M 210,384 C 180,410 180,440 215,446 C 265,454 440,490 620,520 C 730,540 765,490 735,440 C 730,432 715,444 695,456 C 590,505 440,470 290,432 C 240,420 220,400 210,384 Z"
          fill="#FFFFFF" stroke="#001433" stroke-width="6"/>
  </g>

  <!-- TYPOGRAPHY LAYER -->
  <g filter="url(#textGlow)">
    <!-- 'AutoParts' 3D Shadow / Outline -->
    <g font-family="'Arial Black', 'Impact', 'Montserrat', sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
      
      <!-- Black Base / Extrusion Shadow -->
      <text x="512" y="844" font-size="160" fill="#000714" stroke="#000714" stroke-width="32" stroke-linejoin="round">AutoParts</text>
      <text x="512" y="836" font-size="160" fill="#05152E" stroke="#05152E" stroke-width="24" stroke-linejoin="round">AutoParts</text>
      <!-- Dark Blue Accent Stroke -->
      <text x="512" y="830" font-size="160" fill="#002E7A" stroke="#002E7A" stroke-width="16" stroke-linejoin="round">AutoParts</text>
      <!-- Chrome Bevel Under-layer -->
      <text x="512" y="826" font-size="160" fill="#94A3B8" stroke="#94A3B8" stroke-width="8" stroke-linejoin="round">AutoParts</text>
      <!-- Top Chrome / White Fill -->
      <text x="512" y="824" font-size="160" fill="url(#textChromeGrad)">AutoParts</text>

      <!-- 'INDIA' WINGS & TEXT -->
      <!-- Left Cyan Speed Wing -->
      <path d="M 80,896 L 310,872 L 310,918 Z" 
            fill="#020B1A" stroke="#020B1A" stroke-width="10" stroke-linejoin="round"/>
      <path d="M 95,896 L 305,876 L 305,914 Z" 
            fill="url(#wingGradLeft)" stroke="#002666" stroke-width="3"/>
      <path d="M 120,896 L 300,880 L 300,894 Z" 
            fill="#80E5FF"/>

      <!-- Right Cyan Speed Wing -->
      <path d="M 944,896 L 714,872 L 714,918 Z" 
            fill="#020B1A" stroke="#020B1A" stroke-width="10" stroke-linejoin="round"/>
      <path d="M 929,896 L 719,876 L 719,914 Z" 
            fill="url(#wingGradRight)" stroke="#002666" stroke-width="3"/>
      <path d="M 904,896 L 724,880 L 724,894 Z" 
            fill="#80E5FF"/>

      <!-- 'INDIA' Black Shadow -->
      <text x="512" y="930" font-size="88" letter-spacing="12" fill="#020B1A" stroke="#020B1A" stroke-width="22" stroke-linejoin="round">INDIA</text>
      <!-- 'INDIA' Deep Crimson Outline -->
      <text x="512" y="924" font-size="88" letter-spacing="12" fill="#801800" stroke="#801800" stroke-width="12" stroke-linejoin="round">INDIA</text>
      <!-- 'INDIA' Vibrant Orange/Saffron Gradient Fill -->
      <text x="512" y="920" font-size="88" letter-spacing="12" fill="url(#orangeGrad)">INDIA</text>
      <!-- Top Highlight on 'INDIA' -->
      <text x="512" y="916" font-size="88" letter-spacing="12" fill="#FFE2B8" opacity="0.6">INDIA</text>
    </g>
  </g>
</svg>