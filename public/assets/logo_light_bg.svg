
<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&amp;family=Poppins:wght@800;900&amp;display=swap');
      .logo-auto {
        font-family: 'Montserrat', 'Poppins', -apple-system, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 210px;
        fill: #0F172A;
      }
      .logo-parts {
        font-family: 'Montserrat', 'Poppins', -apple-system, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 210px;
        fill: #0A3B73;
      }
      .logo-india {
        font-family: 'Montserrat', 'Poppins', -apple-system, sans-serif;
        font-weight: 900;
        font-size: 54px;
        letter-spacing: 24px;
        fill: #FF6A00;
      }
    </style>
  </defs>

  <g transform="translate(60, 260)">
    <!-- "Auto" Text -->
    <text x="30" y="0" class="logo-auto">Auto</text>
    
    <!-- "Parts" Text -->
    <text x="510" y="0" class="logo-parts">Parts</text>
    
    <!-- Speed line Left -->
    <polygon points="120,80 340,80 340,92 120,80" fill="#FF6A00" />
    
    <!-- "INDIA" Center Text -->
    <text x="580" y="94" text-anchor="middle" class="logo-india">INDIA</text>
    
    <!-- Speed line Right -->
    <polygon points="800,92 800,80 1020,80 800,92" fill="#FF6A00" />
  </g>
</svg>
