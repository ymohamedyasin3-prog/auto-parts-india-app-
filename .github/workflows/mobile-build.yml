name: Build Mobile Apps (Android & iOS)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions: write-all

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Free up disk space on GitHub Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/ndk/25.*
          sudo rm -rf /usr/local/lib/android/ndk/24.*
          sudo rm -rf /usr/local/lib/android/ndk/23.*
          sudo rm -rf /usr/local/lib/android/ndk/22.*
          sudo rm -rf /usr/local/lib/android/ndk/21.*
          df -h

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android Setup Files
        run: |
          mkdir -p react-native-app/android/app
          mkdir -p react-native-app/android/gradle/wrapper

          if [ ! -f "react-native-app/android/app/google-services.json" ] || [ ! -s "react-native-app/android/app/google-services.json" ]; then
            echo "Writing google-services.json via Base64..."
            echo "" | base64 -d > react-native-app/android/app/google-services.json
          fi

          if [ ! -f "react-native-app/android/gradle/wrapper/gradle-wrapper.jar" ] || [ ! -s "react-native-app/android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            curl -sSL -o react-native-app/android/gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v8.8.0/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Install Root Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Generate Android Asset Bundle & APK
        run: |
          cd react-native-app/android
          chmod +x ./gradlew || true
          ./gradlew assembleRelease bundleRelease --no-daemon --no-parallel --build-cache -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC"

      - name: Upload Android Artifacts (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: auto-parts-india-android-bundles
          path: |
            react-native-app/android/app/build/outputs/apk/**/*.apk
            react-native-app/android/app/build/outputs/bundle/**/*.aab

  build-ios:
    name: Build iOS App Bundle & Pods Setup
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd react-native-app
          npm install --legacy-peer-deps

      - name: Generate iOS JS Bundle & Assets
        run: |
          cd react-native-app
          mkdir -p ios
          npx react-native bundle --platform ios --dev false --entry-file index.js --bundle-output ios/main.jsbundle --assets-dest ios/Assets || true

      - name: Setup Xcode Environment & CocoaPods
        run: |
          cd react-native-app
          if [ -d "ios" ] && [ -f "ios/Podfile" ]; then
            cd ios
            pod install --repo-update || pod install || true
          fi
          echo "iOS project layout and CocoaPods verified for Mac builder."

      - name: Upload iOS Project & JS Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auto-parts-india-ios-bundles
          path: |
            react-native-app/ios/
