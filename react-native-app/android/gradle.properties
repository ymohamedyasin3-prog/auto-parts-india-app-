# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=false

# JVM Memory and Execution Optimization for CI & Low RAM
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false
kotlin.daemon.jvmargs=-Xmx1536m

# R8 & Resource Optimization for Speed
android.enableR8.fullMode=false
android.nonTransitiveRClass=false
android.enablePngCrunchInReleaseBuilds=false
android.enableAapt2Daemon=true

# React Native Settings - Build only standard mobile CPU architectures (arm64-v8a, armeabi-v7a) for 2x faster builds
kotlinVersion=1.9.24
reactNativeArchitectures=arm64-v8a,armeabi-v7a
newArchEnabled=false
hermesEnabled=true

